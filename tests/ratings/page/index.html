<title>Thuluth Ratings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one column of two plates, a tie bar beneath, the critic's progress at the foot. */
:root {
  --paper: #f3efe4;
  --plate: #fbf8f0;
  --ink: #1f2540;
  --muted: #5d6178;
  --line: #d9d1bf;
  --gold: #a87a1c;
  --lapis: #22407e;
  --good: #2f7a4d;
  --bad: #a3392b;
  --display: "Spectral", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1229; --plate: #151c38; --ink: #ece6d4; --muted: #a3a9c2; --line: #2b3560;
    --gold: #d8ac45; --lapis: #8fb0f0; --good: #6fc590; --bad: #e8857a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1229; --plate: #151c38; --ink: #ece6d4; --muted: #a3a9c2; --line: #2b3560;
  --gold: #d8ac45; --lapis: #8fb0f0; --good: #6fc590; --bad: #e8857a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 24px;
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
h1 { font: 600 22px/1.2 var(--display); margin: 0; text-wrap: balance; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.text { font: 500 20px/1.4 var(--display); color: var(--gold); text-align: center; min-height: 1.4em; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .pair { grid-template-columns: 1fr; } }
.choice {
  display: block; width: 100%; padding: 0; border: 2px solid var(--line); border-radius: 10px; background: var(--plate);
  cursor: pointer; overflow: hidden; transition: border-color .12s, transform .12s; color: var(--muted);
}
.choice img { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: contain; background: #0b1029; }
.choice span { display: block; padding: 6px 10px; font-size: 12px; text-align: left; }
.choice:hover { border-color: var(--gold); }
.choice:focus-visible, .bar button:focus-visible { outline: 3px solid var(--lapis); outline-offset: 2px; }
.choice:active { transform: scale(.99); }
.plate { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.dislike {
  align-self: center; font: 500 13px var(--body); padding: 6px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
}
.dislike:hover { color: var(--bad); border-color: var(--bad); }
.dislike:focus-visible { outline: 3px solid var(--lapis); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.bar button {
  font: 500 14px var(--body); padding: 9px 18px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--plate); color: var(--ink); cursor: pointer;
}
.bar button:disabled { opacity: .45; cursor: default; }
.keys { color: var(--muted); font-size: 12px; text-align: center; }
.status { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.status b { color: var(--ink); font-weight: 600; }
.status .ok { color: var(--good); }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .choice { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Which is more beautiful?</h1>
    <div class="count" id="count">Loading the compositions…</div>
  </header>
  <div class="text" id="text" dir="rtl" lang="ar"></div>
  <div class="pair" id="pair">
    <div class="plate">
      <button class="choice" id="a" type="button" aria-label="The first composition is more beautiful"><img alt="" id="ia"><span id="la"></span></button>
      <button class="dislike" id="da" type="button">Don't like this one</button>
    </div>
    <div class="plate">
      <button class="choice" id="b" type="button" aria-label="The second composition is more beautiful"><img alt="" id="ib"><span id="lb"></span></button>
      <button class="dislike" id="db" type="button">Don't like this one</button>
    </div>
  </div>
  <div class="empty" id="empty" hidden></div>
  <div class="bar">
    <button type="button" id="tie">About the same</button>
    <button type="button" id="neither">Don't like either</button>
    <button type="button" id="undo" disabled>Undo last</button>
  </div>
  <div class="keys">Keys: ← first · → second · ↓ about the same · X don't like either · Backspace undo</div>
  <div class="status" id="status"></div>
</div>

<script>
// The rating loop (PLAN-2 §1). Candidates come from the engine's sweep (items.json: each composition's critic features,
// checks and genre, plus the fits in force). Votes are saved to this page's database (collection "votes"), so they
// outlive any browser. Pairs are chosen where the critic is least sure, among the least-rated compositions, with some
// chosen to test a reported check; the page refits each genre on the votes so far and reports leave-one-out accuracy.
const FEATURES = ['texture', 'knots', 'looseTop', 'unity', 'span', 'fill', 'noise'];
const CHECKS = ['wordSpace', 'strayMarks', 'strayDots', 'doubled'];
const $ = id => document.getElementById(id);
// mine: what this view saved, newest last ({col, id}), so Undo removes it; disliked: compositions not to show again
const state = { items: [], byId: {}, fits: {}, votes: [], disliked: new Set(), mine: [], pair: null, db: null, uid: null, writable: true, busy: false };

const sig = x => 1 / (1 + Math.exp(-x));
const score = (it, fit) => fit.features.reduce((a, k, j) => a + fit.w[j] * (it.features[k] - fit.mean[j]) / fit.sd[j], 0);
const pWin = (a, b) => { const f = state.fits[a.genre]; return f ? sig(score(a, f) - score(b, f)) : 0.5; };
const key = (a, b) => [a, b].sort().join('|');

function choosePair() {
  const seen = new Set(state.votes.map(v => key(v.a, v.b))), cnt = {};
  state.votes.forEach(v => { cnt[v.a] = (cnt[v.a] || 0) + 1; cnt[v.b] = (cnt[v.b] || 0) + 1; });
  const testCheck = Math.random() < 0.25;
  let best = null;
  const its = state.items;
  for (let i = 0; i < its.length; i++) for (let j = i + 1; j < its.length; j++) {
    const a = its[i], b = its[j];
    if (a.genre !== b.genre || seen.has(key(a.id, b.id)) || state.disliked.has(a.id) || state.disliked.has(b.id)) continue;
    const unsure = Math.abs(pWin(a, b) - 0.5), rated = (cnt[a.id] || 0) + (cnt[b.id] || 0);
    let cost = unsure + 0.05 * rated + 0.05 * Math.random() + (a.text === b.text ? 0 : 0.08);
    if (testCheck && a.checks && b.checks) cost -= 0.06 * CHECKS.reduce((s, c) => s + Math.min(3, Math.abs((a.checks[c] || 0) - (b.checks[c] || 0))), 0);
    if (!best || cost < best.cost) best = { a, b, cost };
  }
  if (!best) return null;
  return Math.random() < 0.5 ? [best.a, best.b] : [best.b, best.a];
}

function show() {
  const p = state.pair = choosePair();
  $('pair').hidden = !p; $('empty').hidden = !!p;
  if (!p) { $('empty').textContent = 'Every pair left in this round has a vote. Thank you.'; $('text').textContent = ''; }
  else {
    $('ia').src = p[0].url; $('ib').src = p[1].url;
    $('text').textContent = p[0].text === p[1].text ? p[0].text : p[0].text + '  ·  ' + p[1].text;
    $('la').textContent = 'First'; $('lb').textContent = 'Second';
  }
  status();
}

async function vote(w) {
  if (!state.pair || state.busy) return;
  const [a, b] = state.pair, v = { a: a.id, b: b.id, w, t: Date.now(), by: state.uid || '' };
  if (!state.db || !state.writable) { state.votes.push(v); show(); return; }
  state.busy = true;
  try {
    const ref = await state.db.collection('votes').add(v);
    state.mine.push({ col: 'votes', id: ref.id }); $('undo').disabled = false;
  } catch (e) {
    if (e && e.code === 'invalid_argument') { state.writable = false; state.votes.push(v); }
    else $('count').textContent = 'That vote was not saved (' + (e && e.code || 'error') + '). Try again.';
  } finally { state.busy = false; }
  if (!state.db || !state.writable) show();
}

// don't like: the composition is set aside for good (one document per composition), and a new pair is shown
async function dislike(items) {
  if (state.busy || !items.length) return;
  items.forEach(it => state.disliked.add(it.id));
  if (!state.db || !state.writable) { show(); return; }
  state.busy = true;
  try {
    for (const it of items) {
      await state.db.collection('dislikes').doc(it.id).set({ id: it.id, t: Date.now(), by: state.uid || '' });
      state.mine.push({ col: 'dislikes', id: it.id });
    }
    $('undo').disabled = false;
  } catch (e) {
    if (e && e.code === 'invalid_argument') state.writable = false;
    else $('count').textContent = 'That was not saved (' + (e && e.code || 'error') + '). Try again.';
  } finally { state.busy = false; }
  show();
}

async function undo() {
  const last = state.mine.pop();
  $('undo').disabled = !state.mine.length;
  if (!last || !state.db) return;
  try { await state.db.collection(last.col).doc(last.id).delete(); } catch (e) { /* the snapshots show what is stored */ }
}

// a pairwise logistic fit on standardised features, and its leave-one-out accuracy (as npm run refit does)
function fitLoo(rows) {
  const fit = data => { const k = data[0].d.length, w = new Array(k).fill(0);
    for (let it = 0; it < 600; it++) { const g = w.map(x => 0.01 * x);
      for (const { d, y } of data) { const p = sig(d.reduce((s, x, j) => s + x * w[j], 0)); for (let j = 0; j < k; j++) g[j] += (p - y) * d[j] / data.length; }
      for (let j = 0; j < k; j++) w[j] -= 0.5 * g[j]; }
    return w; };
  let right = 0;
  rows.forEach((r, i) => { const w = fit(rows.filter((_, j) => j !== i)); if ((r.d.reduce((s, x, j) => s + x * w[j], 0) > 0) === (r.y === 1)) right++; });
  return right / rows.length;
}

function status() {
  const vs = state.votes.filter(v => v.w !== 'tie' && state.byId[v.a] && state.byId[v.b]);
  $('count').textContent = `${state.votes.length} votes · ${state.items.length - state.disliked.size} compositions` + (state.disliked.size ? ` · ${state.disliked.size} set aside` : '');
  const lines = [];
  // how often the critic in force already agreed: its prediction against each choice
  if (vs.length) {
    const agree = vs.filter(v => (pWin(state.byId[v.a], state.byId[v.b]) > 0.5) === (v.w === 'a')).length;
    lines.push(`The critic agreed with <b>${agree} of ${vs.length}</b> choices (${Math.round(100 * agree / vs.length)}%).`);
  }
  for (const g of ['dense', 'single', 'mirror']) {
    const rows = vs.filter(v => state.byId[v.a].genre === g && state.byId[v.b].genre === g);
    if (rows.length < 12) { if (rows.length) lines.push(`${g}: ${rows.length} votes this round; the refit starts at 12.`); continue; }
    const fit = state.fits[g], z = it => fit.features.map((k, j) => (it.features[k] - fit.mean[j]) / fit.sd[j]);
    const data = rows.map(v => { const A = z(state.byId[v.a]), B = z(state.byId[v.b]); return { d: A.map((x, j) => x - B[j]), y: v.w === 'a' ? 1 : 0 }; });
    const loo = fitLoo(data), target = loo >= 0.85;
    lines.push(`${g}: refit on ${rows.length} votes predicts <b class="${target ? 'ok' : ''}">${Math.round(100 * loo)}%</b> of them left out (aim 85%).`);
  }
  if (!state.db) lines.push('Votes are not being saved in this view: open the page signed in to claude.ai to keep them.');
  else if (!state.writable) lines.push('This view can read the votes but not add to them; ask for Contributor access to rate.');
  $('status').innerHTML = lines.map(l => `<div>${l}</div>`).join('');
}

async function start() {
  try {
    const data = await (await fetch('items.json')).json();
    state.items = data.items; state.fits = data.fits;
    state.items.forEach(it => state.byId[it.id] = it);
  } catch (e) { $('count').textContent = 'The compositions could not be loaded.'; return; }
  show();
  const db = window.claude ? await window.claude.use('db') : null;
  const user = window.claude ? await window.claude.use('user') : null;
  if (user) try { state.uid = await user.id(); } catch (e) { /* votes are still kept without it */ }
  if (!db) { status(); return; }
  state.db = db;
  db.collection('votes').onSnapshot(s => {
    state.votes = s.docs.map(d => d.data());
    // the shown pair stays unless it has just been voted on
    const p = state.pair;
    if (!p || state.votes.some(v => key(v.a, v.b) === key(p[0].id, p[1].id))) show(); else status();
  }, () => { state.db = null; status(); });
  db.collection('dislikes').onSnapshot(s => {
    state.disliked = new Set(s.docs.map(d => d.id));
    const p = state.pair;
    if (p && (state.disliked.has(p[0].id) || state.disliked.has(p[1].id))) show(); else status();
  }, () => {});
}

$('a').addEventListener('click', () => vote('a'));
$('b').addEventListener('click', () => vote('b'));
$('tie').addEventListener('click', () => vote('tie'));
$('undo').addEventListener('click', undo);
$('da').addEventListener('click', () => state.pair && dislike([state.pair[0]]));
$('db').addEventListener('click', () => state.pair && dislike([state.pair[1]]));
$('neither').addEventListener('click', () => state.pair && dislike(state.pair));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') vote('a'); else if (e.key === 'ArrowRight') vote('b');
  else if (e.key === 'ArrowDown') vote('tie'); else if (e.key === 'x' || e.key === 'X') { if (state.pair) dislike(state.pair); }
  else if (e.key === 'Backspace') { e.preventDefault(); undo(); }
});
start();
</script>
