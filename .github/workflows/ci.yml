name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The embedded kernels (src/kernels/*.wasm.ts) must be what the compiler makes of their C. The same bytes are
      # only promised from the compiler they were built with, so this rebuilds under that one and is skipped, with a
      # notice, on a runner that has another; tests/kernels-fresh.test.ts checks the source hashes everywhere.
      - name: Kernels rebuild to the same bytes
        run: |
          if command -v clang-18 >/dev/null && command -v wasm-ld-18 >/dev/null &&
            clang-18 --version | grep -qF 'Ubuntu clang version 18.1.3 (1ubuntu1)'; then
            CC=clang-18 npm run build:wasm
            git diff --exit-code -- src/kernels
          else
            echo "::notice::clang 18.1.3 (1ubuntu1) with wasm-ld is not on this runner: the kernel rebuild check was skipped"
          fi
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
