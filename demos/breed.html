<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breeder</title>
<style>
:root{--bg:#E4E7E2;--surface:#F2F3EF;--ink:#18302F;--muted:#56676A;--line:#C7CDC6;--accent:#1F6F68}
@media (prefers-color-scheme:dark){:root{--bg:#0F1B1B;--surface:#162626;--ink:#E1EAE7;--muted:#93A5A2;--line:#2A3C3B;--accent:#5FB3A9}}
body{margin:0;padding:16px;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 12px;color:var(--muted);max-width:75ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,input{font:inherit;padding:4px 10px}input[type=text]{min-width:220px;direction:rtl}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
figure{margin:0;background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:6px;cursor:pointer;min-height:120px}
figure.picked{border-color:var(--accent)}figure svg{display:block;width:100%;height:auto}
figcaption{font-size:11px;color:var(--muted);margin-top:4px}#status{color:var(--muted)}
</style>
</head>
<body>
<h1>Breeder</h1>
<p>Sixteen candidates are resolved and judged in worker threads and shown as they finish, best-scored first. Click one or two you like and press Breed: the next generation is mutants (and crosses) of your picks, and the critic's weights shift toward what your picks do well.</p>
<div class="bar">
  <input type="text" id="text" value="بسم الله الرحمن الرحيم">
  <label>Seed <input type="number" id="seed" value="7" style="width:6em"></label>
  <button id="fresh">New generation</button><button id="breed">Breed from picks</button>
  <span id="status"></span>
</div>
<div class="g" id="g"></div>
<script type="module">
import { Rng, EvalPool, freshGeneration, breedFrom, newTaste, learn, score } from '../src/evolve/index.ts';
const N = 16, pool = new EvalPool();
let taste = newTaste(), gen = [], results = [], picks = new Set(), rng;
const $ = id => document.getElementById(id), status = s => ($('status').textContent = s);
function show() {
  const order = results.map((r, i) => i).filter(i => results[i]).sort((a, b) => score(results[b].metrics, taste) - score(results[a].metrics, taste));
  $('g').innerHTML = '';
  for (const i of order) {
    const r = results[i], f = document.createElement('figure');
    if (picks.has(i)) f.className = 'picked';
    const m = r.metrics ? Object.entries(r.metrics).map(([k, v]) => `${k} ${v.toFixed(2)}`).join(' · ') : 'no metrics';
    f.innerHTML = r.svg + `<figcaption><b>${score(r.metrics, taste).toFixed(3)}</b> · ${r.ms.toFixed(0)} ms<br>${m}</figcaption>`;
    f.onclick = () => { picks.has(i) ? picks.delete(i) : picks.add(i); show(); };
    $('g').append(f);
  }
}
async function run(comps) {
  gen = comps; results = []; picks = new Set(); show();
  const t0 = performance.now(); let n = 0;
  status(`evaluating 0/${N}…`);
  await pool.run(comps, (i, o) => {
    n++; if (o.ok) results[i] = o.result; else console.warn(o.error);
    status(`evaluating ${n}/${N}… ${pool.threaded ? '(workers)' : '(in-thread)'}`); show();
  });
  status(`${N} candidates in ${((performance.now() - t0) / 1000).toFixed(1)} s · ${taste.picks} picks learned`);
}
const texts = () => ({ main: { text: $('text').value, repeat: 'fill', wordGap: 2 } });
$('fresh').onclick = () => { rng = new Rng(+$('seed').value || 1); run(freshGeneration(N, texts(), { rng, taste })); };
$('breed').onclick = () => {
  if (!picks.size) return status('pick one or two first');
  const ps = [...picks].map(i => ({ comp: gen[i], m: results[i]?.metrics ?? null }));
  taste = learn(taste, ps, results.map(r => r?.metrics ?? null));
  run(breedFrom(ps.map(p => p.comp), N, 0.5, { rng, taste }));
};
$('fresh').onclick();
</script>
</body>
</html>
