<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basmala Tuning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: the roundel first, full width on a phone; the controls for the selected piece under it, then the marks and
   saving. On a wide screen, the roundel on the left and the controls in a column on the right. */
:root {
  --paper: #f3efe4;
  --plate: #fbf8f0;
  --ink: #1f2540;
  --muted: #5d6178;
  --line: #d9d1bf;
  --gold: #a87a1c;
  --lapis: #22407e;
  --pick: #c2410c;
  --display: "Spectral", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arabic: "Amiri", "Noto Naskh Arabic", "Geeza Pro", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1229; --plate: #151c38; --ink: #ece6d4; --muted: #a3a9c2; --line: #2b3560;
    --gold: #d8ac45; --lapis: #8fb0f0; --pick: #fb923c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1229; --plate: #151c38; --ink: #ece6d4; --muted: #a3a9c2; --line: #2b3560;
  --gold: #d8ac45; --lapis: #8fb0f0; --pick: #fb923c; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
.wrap { max-width: 1060px; margin: 0 auto; display: grid; gap: 14px; }
@media (min-width: 860px) { .wrap { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } .wrap > header { grid-column: 1 / -1; } }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
h1 { font: 600 22px/1.2 var(--display); margin: 0; text-wrap: balance; }
h2 { font: 600 13px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.status { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.stage { display: grid; gap: 8px; min-width: 0; }
.view { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #ece6d6; aspect-ratio: 1 / 1; max-width: 100%; touch-action: manipulation; }
.view svg { display: block; width: 100%; height: 100%; }
.view.line { aspect-ratio: auto; background: #f6f1e4; overflow-x: auto; }
.view.line svg { height: auto; min-width: 680px; }
.view.busy::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--paper) 25%, transparent); }
.hint { color: var(--muted); font-size: 13px; }
.panel { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--plate); min-width: 0; }
.side { display: grid; gap: 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select, textarea { font: inherit; color: var(--ink); }
button, select { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--lapis); outline-offset: 2px; }
button.on { border-color: var(--pick); color: var(--pick); font-weight: 600; }
.primary { background: var(--lapis); border-color: var(--lapis); color: var(--paper); font-weight: 600; }
.pieces { display: flex; flex-wrap: wrap; gap: 6px; direction: rtl; }
.pieces .word { display: flex; gap: 3px; padding: 3px; border: 1px dashed var(--line); border-radius: 9px; }
.pieces button { font: 500 20px/1.2 var(--arabic); padding: 2px 10px; min-width: 40px; }
.pad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 40px); gap: 4px; }
.pad button { padding: 0; font-size: 18px; }
.pad .u { grid-column: 2; grid-row: 1; } .pad .l { grid-column: 1; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 3; }
.pad .c { grid-column: 2; grid-row: 2; font-size: 11px; }
.variants { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.variants button { flex: 0 0 auto; display: grid; gap: 2px; justify-items: center; padding: 6px; min-width: 64px; }
.variants svg { height: 48px; width: auto; max-width: 140px; fill: var(--ink); }
.variants span { font-size: 11px; color: var(--muted); }
.variants button.on span { color: var(--pick); }
label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
input[type=range] { width: 140px; accent-color: var(--lapis); }
textarea { width: 100%; min-height: 72px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); resize: vertical; }
.saved { display: grid; gap: 6px; }
.saved button { text-align: left; display: grid; gap: 2px; width: 100%; }
.saved small { color: var(--muted); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Basmala tuning</h1>
    <div class="status" id="status" aria-live="polite">Loading the engine…</div>
  </header>

  <div class="stage">
    <div class="row">
      <label for="start">Start from</label>
      <select id="start"></select>
      <button type="button" id="undo" disabled>Undo</button>
      <button type="button" id="redo" disabled>Redo</button>
    </div>
    <div class="view" id="view" role="img" aria-label="The basmala roundel as it stands"></div>
    <div class="hint">Tap a piece of a word to select it, or pick it below. Moves are in pen widths. A line scrolls sideways on a phone.</div>
  </div>

  <div class="side">
    <section class="panel" aria-labelledby="h-piece">
      <h2 id="h-piece">Selected</h2>
      <div class="pieces" id="pieces"></div>
      <div class="hint" id="sel">Nothing selected.</div>
      <div class="row">
        <div class="seg" role="group" aria-label="What the arrows move">
          <button type="button" id="mWord" class="on">Move the word</button>
          <button type="button" id="mPiece">Move the piece</button>
        </div>
        <label for="step">Step <select id="step"><option value="0.25">¼</option><option value="0.5" selected>½</option><option value="1">1</option><option value="3">3</option></select></label>
      </div>
      <div class="row">
        <div class="pad">
          <button type="button" class="u" id="up" aria-label="Up">↑</button>
          <button type="button" class="l" id="left" aria-label="Left">←</button>
          <button type="button" class="c" id="reset" aria-label="Put the piece back where its word puts it">reset</button>
          <button type="button" class="r" id="right" aria-label="Right">→</button>
          <button type="button" class="d" id="down" aria-label="Down">↓</button>
        </div>
        <label><input type="checkbox" id="lift"> Lift onto the piece before</label>
      </div>
      <h2>Shape of the piece</h2>
      <div class="variants" id="variants"></div>
    </section>

    <section class="panel" aria-labelledby="h-marks">
      <h2 id="h-marks">Marks</h2>
      <label><input type="checkbox" id="vowels"> Vowels</label>
      <label><input type="checkbox" id="orn"> Ornaments in the gaps</label>
      <label for="density">Ornaments <input type="range" id="density" min="0" max="1" step="0.05"></label>
      <label for="clear">Space round marks <input type="range" id="clear" min="0" max="1.5" step="0.25"></label>
    </section>

    <section class="panel" aria-labelledby="h-save">
      <h2 id="h-save">Save</h2>
      <label for="note" class="hint">What still looks wrong? I read this with each saved layout.</label>
      <textarea id="note" placeholder="e.g. الرحمن's ra sits too low; the lam of الله should be taller"></textarea>
      <div class="row"><button type="button" class="primary" id="save">Save this layout</button><span class="hint" id="saveMsg"></span></div>
      <h2>Saved</h2>
      <div class="saved" id="saved"><div class="hint">Nothing saved yet. Saved layouts appear here for everyone who opens this page.</div></div>
    </section>
  </div>
</div>
<script type="module" src="../src/tune/main.ts"></script>
</body>
</html>
