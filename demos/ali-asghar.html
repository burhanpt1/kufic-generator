<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali Asghar</title>
<style>
:root{--bg:#E4E7E2;--surface:#F2F3EF;--ink:#18302F;--muted:#56676A;--line:#C7CDC6}
@media (prefers-color-scheme:dark){:root{--bg:#0F1B1B;--surface:#162626;--ink:#E1EAE7;--muted:#93A5A2;--line:#2A3C3B}}
body{margin:0;padding:16px;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 12px;color:var(--muted);max-width:80ch}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:8px}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;min-width:0}
figure img{display:block;width:100%;height:auto;border-radius:3px}figcaption{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<h1>Ali Asghar</h1>
<p>The name in a thuluth cartouche, علي on the right of أصغر with the alif rising between them, framed by ornament alone (a braid between pearls and rules), on eight-fold Iznik tiles to the edge of an A3 sheet. <code>npm run ali-asghar</code> writes the print files.</p>
<div class="row" id="out"></div>
<script type="module">
import { loadKernels } from '../src/kernels/index.ts';
await loadKernels();
import { aliAsgharSheet } from '../src/showpiece/aliAsghar.ts';
const out = document.getElementById('out');
for (const v of ['lapis', 'cobalt']) {
  const t0 = performance.now(), s = aliAsgharSheet(v), f = document.createElement('figure');
  f.innerHTML = `<img alt="Ali Asghar, ${v}" src="${URL.createObjectURL(new Blob([s.svg], { type: 'image/svg+xml' }))}"><figcaption>${v === 'cobalt' ? 'White on cobalt' : 'Gold on lapis'} · ${(performance.now() - t0).toFixed(0)} ms</figcaption>`;
  out.append(f);
}
</script>
</body>
</html>
